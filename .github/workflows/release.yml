name: Build and publish PickVideo

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pickvideo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify version and release notes
        id: version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import os
          from pathlib import Path
          import plistlib
          metadata = plistlib.loads(Path('Resources/Info.plist').read_bytes())
          version = metadata['CFBundleShortVersionString']
          if os.environ['RELEASE_REF_TYPE'] == 'tag' and os.environ['RELEASE_REF'] != f'v{version}':
              raise SystemExit('Release tag does not match the app version')
          if not Path(f'docs/releases/v{version}.md').is_file():
              raise SystemExit('Release notes are missing')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'version={version}\n')
          PY
      - name: Install build and test dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install ffmpeg node aria2
          python3 -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Fetch and verify the pinned official engine
        run: python3 fetch-engine.py
      - name: Build and run core checks
        run: ./build.sh "$PWD/dist"
      - name: Run login and media regressions
        run: |
          dist/拾影.app/Contents/MacOS/PickVideo --login-detection-test
          dist/拾影.app/Contents/MacOS/PickVideo --auth-lifecycle-test
          python3 -B Tests/test_bilibili_api.py
          python3 -B Tests/test_media_sync.py
      - name: Package and verify release downloads
        run: python3 scripts/package-release.py dist/拾影.app release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pickvideo-release
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pickvideo-release
          path: release-assets/
      - name: Verify downloaded assets
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --draft --title "拾影 $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
